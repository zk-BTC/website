name: Deploy main to Cloudflare Pages

# Direct Upload of the static site to the PRD Pages project on push to main.
# No build. Project zkbtc-website is created in the Cloudflare Terraform.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: prd-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: wrangler pages deploy
    if: github.repository == 'zk-btc/website'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          wrangler pages deploy . \
            --project-name=zkbtc-website \
            --branch=main \
            --commit-hash=${{ github.sha }} \
            --commit-message="${COMMIT_MSG:-workflow_dispatch}"
